[package]
name = "spotdl-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
regex = "1"
dirs = "6"
urlencoding = "2"
rfd = "0.15"
tao = "0.30"
wry = "0.47"