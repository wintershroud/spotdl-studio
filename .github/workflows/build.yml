name: Build portable apps

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            tauri_args: --no-bundle
          - os: macos-latest
            platform: macos
            tauri_args: --bundles app,dmg
          - os: ubuntu-22.04
            platform: linux
            tauri_args: --bundles appimage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev patchelf file

      - name: Fetch pinned engines (spotDL, ffmpeg, deno)
        shell: bash
        run: bash scripts/fetch-engines.sh ${{ matrix.platform }}

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --release

      - name: Build app
        run: npx --yes @tauri-apps/cli@2.12.4 build ${{ matrix.tauri_args }}

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p out
          case "${{ matrix.platform }}" in
            windows) cp src-tauri/target/release/spotdl-studio.exe "out/spotDL-Studio-Windows.exe" ;;
            macos)   cp src-tauri/target/release/bundle/dmg/*.dmg "out/spotDL-Studio-macOS.dmg" ;;
            linux)   cp src-tauri/target/release/bundle/appimage/*.AppImage "out/spotDL-Studio-Linux.AppImage" ;;
          esac
          ls -la out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotDL-Studio-${{ matrix.platform }}
          path: out/*

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: spotDL Studio (Latest Build)
          prerelease: false
          files: artifacts/*
