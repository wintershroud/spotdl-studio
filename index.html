<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>spotDL Studio</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0; background: #121212; color: #ffffff;
      display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 28px;
    }
    .card {
      background: #181818; border: 1px solid #282828; border-radius: 16px;
      width: 93%; max-width: 840px; padding: 32px 36px; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .title { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #1DB954; }
    label { display: block; font-size: 13px; color: #b3b3b3; margin-bottom: 6px; font-weight: 600; }
    input, select {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #333;
      background: #242424; color: #fff; font-size: 14px; outline: none; margin-bottom: 16px;
    }
    input::placeholder { color: #757575; }
    input:focus, select:focus { border-color: #1DB954; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .save-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .save-row input { margin-bottom: 0; flex: 1; }
    .actions { display: flex; gap: 12px; margin-top: 6px; }
    button {
      padding: 13px 18px; border: none; border-radius: 999px; font-size: 14px;
      font-weight: 700; cursor: pointer; transition: 0.15s ease;
    }
    .btn-primary { background: #1DB954; color: #000; flex: 2; }
    .btn-primary:hover { background: #1ed760; }
    .btn-primary:disabled { background: #2e5e3e; color: #888; cursor: not-allowed; }
    .btn-cancel { background: #2c2c2e; color: #ff6b6b; flex: 1; }
    .btn-cancel:hover { background: #3a3a3c; }
    .btn-browse {
      background: #242424; color: #b3b3b3; border: 1px solid #333;
      border-radius: 10px; padding: 0 18px; font-size: 13px; font-weight: 600;
    }
    .btn-browse:hover { border-color: #1DB954; color: #fff; }
    .badge {
      background: #242424; color: #1DB954; border: 1px solid #1DB95444;
      border-radius: 999px; font-size: 12px; font-weight: 600; padding: 6px 13px;
    }
    .badge.warn { color: #b3b3b3; border-color: #333; }
    .btn-clear { background: #2c2c2e; color: #fff; font-size: 12px; padding: 7px 13px; }
    .log-header { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; margin-bottom: 8px; }
    .status { font-size: 13px; font-weight: 600; color: #b3b3b3; }
    .status.running { color: #1DB954; }
    .status.error { color: #ff6b6b; }
    .log-box {
      background: #0d0d0d; border: 1px solid #282828; border-radius: 10px;
      height: 225px; overflow-y: auto; padding: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px; line-height: 1.5; color: #d4d4d4; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title"><span class="dot"></span> spotDL Studio</div>
      <span id="ffmpegBadge" class="badge warn">Checking audio engine...</span>
    </div>

    <label for="query">Spotify Link or Song Search</label>
    <input type="text" id="query" placeholder="Paste a Spotify link or type 'Artist - Song'..." />

    <label for="outputDir">Save Location</label>
    <div class="save-row">
      <input type="text" id="outputDir" value="__DEFAULT_OUTPUT__" placeholder="Enter directory..." onchange="saveDefaultDir()" />
      <button type="button" id="browseBtn" class="btn-browse" onclick="browseFolder()">Browse</button>
    </div>

    <div class="row">
      <div>
        <label for="format">Audio Format</label>
        <select id="format">
          <option value="m4a" selected>m4a (Native Apple/Spotify)</option>
          <option value="mp3">mp3 (Requires FFmpeg)</option>
          <option value="flac">flac</option>
          <option value="opus">opus</option>
          <option value="wav">wav</option>
        </select>
      </div>
      <div>
        <label for="bitrate">Bitrate</label>
        <select id="bitrate">
          <option value="320k" selected>320k</option>
          <option value="256k">256k</option>
          <option value="192k">192k</option>
          <option value="128k">128k</option>
        </select>
      </div>
      <div>
        <label for="naming">File Naming</label>
        <select id="naming">
          <option value="title" selected>Song Title</option>
          <option value="artist_title">Artist - Title</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="downloadBtn" class="btn-primary" onclick="startDownload()">Download</button>
      <button class="btn-cancel" onclick="cancelDownload()">Cancel</button>
    </div>

    <div class="log-header">
      <span id="statusText" class="status">Ready</span>
      <button class="btn-clear" onclick="document.getElementById('logBox').textContent=''">Clear Log</button>
    </div>
    <div id="logBox" class="log-box">Ready. Paste a Spotify link or type "Artist - Song" and click Download.</div>
  </div>

  <script>
    const logBox = document.getElementById("logBox");
    const statusText = document.getElementById("statusText");
    const downloadBtn = document.getElementById("downloadBtn");
    const ffmpegBadge = document.getElementById("ffmpegBadge");
    const browseBtn = document.getElementById("browseBtn");

    function appendLog(line) {
      logBox.textContent += "\n" + line;
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function checkEngine() {
      const res = await fetch("/check-engine");
      const data = await res.json();
      if (data.ffmpeg) {
        ffmpegBadge.textContent = "FFmpeg Ready (All Formats)";
        ffmpegBadge.classList.remove("warn");
      } else {
        ffmpegBadge.textContent = "M4A Direct Mode";
        ffmpegBadge.classList.add("warn");
      }
    }

    async function saveDefaultDir() {
      const outputDir = document.getElementById("outputDir").value.trim();
      await fetch("/save-config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ output_dir: outputDir })
      });
    }

    async function browseFolder() {
      browseBtn.disabled = true;
      browseBtn.textContent = "Opening...";
      try {
        const res = await fetch("/browse-folder");
        const data = await res.json();
        if (data.path) {
          document.getElementById("outputDir").value = data.path;
          saveDefaultDir();
        }
      } finally {
        browseBtn.disabled = false;
        browseBtn.textContent = "Browse";
      }
    }

    async function startDownload() {
      const query = document.getElementById("query").value.trim();
      if (!query) {
        statusText.textContent = "Please enter a Spotify link or song name.";
        statusText.className = "status error";
        return;
      }
      saveDefaultDir();
      downloadBtn.disabled = true;
      statusText.textContent = "Downloading...";
      statusText.className = "status running";

      const res = await fetch("/download", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          query,
          output_dir: document.getElementById("outputDir").value.trim(),
          format: document.getElementById("format").value,
          bitrate: document.getElementById("bitrate").value,
          naming: document.getElementById("naming").value
        })
      });
      const data = await res.json();
      if (!res.ok) {
        statusText.textContent = data.error || "Unable to start download.";
        statusText.className = "status error";
        downloadBtn.disabled = false;
      }
    }

    async function cancelDownload() {
      await fetch("/cancel", { method: "POST" });
      statusText.textContent = "Cancelled";
      statusText.className = "status error";
      downloadBtn.disabled = false;
    }

    const evtSource = new EventSource("/logs");
    evtSource.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === "log") {
        appendLog(msg.text);
      } else if (msg.type === "done") {
        downloadBtn.disabled = false;
        if (msg.code === 0) {
          statusText.textContent = "Download complete!";
          statusText.className = "status running";
        } else {
          statusText.textContent = "Download failed. Check log for details.";
          statusText.className = "status error";
        }
        checkEngine();
      }
    };

    checkEngine();
  </script>
</body>
</html>
